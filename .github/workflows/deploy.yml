name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - '_talks/**'
      - '_skills/**'
      - '_plugins/**'
      - '_layouts/**'
      - '_includes/**'
      - 'assets/**'
      - 'index.md'
      - 'llms.txt'
      - '_data/**'
      - 'pdfs/**'
      - '*.html'
      - '_config.yml'
      - '.github/legacy-talks-without-skills.txt'
      - '.github/workflows/deploy.yml'
      - 'lib/talk_skill_validator.rb'
      - 'utils/validate_talk_skills.rb'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.13'
        bundler-cache: true
    
    - name: Run essential tests before deployment
      run: bundle exec rake quick
    
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6
      with:
        # Don't try to auto-enable GitHub Pages - requires manual setup first
        enablement: false
    
    - name: Build with Jekyll
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
    
    - name: Verify talk skills and llms.txt in the deployment artifact
      run: bundle exec ruby utils/validate_talk_skills.rb --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
